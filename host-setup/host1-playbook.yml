---
- hosts: all
  become: yes
  tasks:
  - name: Install system dependencies (Scapy, net-tools, iperf3, numpy)
    apt: 
      name:
        - python3-scapy
        - net-tools
        - iperf3
        - python3-numpy
      state: present
      update_cache: yes

  - name: Adjust arp table
    command: arp -i enp0s8 -s 192.168.50.12 08:00:27:1d:e0:27

  - name: Adjust arp table for host-3
    command: arp -i enp0s8 -s 192.168.50.13 08:00:27:1d:e0:28