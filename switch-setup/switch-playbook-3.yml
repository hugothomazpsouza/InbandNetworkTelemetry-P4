---
- hosts: all
  tasks:
  - name: Get data interfaces
    shell: ls /sys/class/net | grep -E '^enp' | grep -v 'enp0s3\|enp0s8' | sort -V
    register: data_ifaces
  - name: Enable data interfaces
    command: ifconfig {{ item }} up
    with_items: "{{ data_ifaces.stdout_lines }}"
    become: yes
  - name: Compile p4 code
    command: p4c -b bmv2 /vagrant/code/int.p4 -o /vagrant/code/int.bmv2
    become: yes
  - name: Start Bmv2 Switch
    shell: "simple_switch --device-id 3 --thrift-port 9090 --interface 0@{{ data_ifaces.stdout_lines[0] }} --interface 1@{{ data_ifaces.stdout_lines[1] }} /vagrant/code/int.bmv2/int.json &"
    async: 1000
    poll: 5
    become: yes
  - name: Insert entries in switch table by control plane
    shell: cat /vagrant/code/table3.txt | simple_switch_CLI
    become: yes
